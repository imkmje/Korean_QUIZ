<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --paper:#FFFDF6; --paper-dim:#F5EEDA; --grid:#E8DEC0; --ink:#262220; --ink-soft:#5B5348;
  --red:#FF4B4B; --red-deep:#D62F2F; --navy:#2E3A4F;
  --green:#28C76F; --green-deep:#1B9E56; --gold:#FFC93C; --gold-deep:#EFA500;
  --blue:#3B82F6; --purple:#8B5CF6; --shadow-c:#262220;
  /* 옵션 버튼 전용 진한 톤 — 흰 텍스트 대비(WCAG 큰 텍스트 3:1) 확보용 */
  --opt-red:#E63946; --opt-blue:#2F6FE0; --opt-gold:#FFC93C; --opt-green:#1FA35C;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  background:var(--paper); color:var(--ink); font-family:'Noto Sans KR',sans-serif;
  min-height:100vh; overscroll-behavior:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px;
  overflow-x:hidden;
}
.screen{ display:none; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.screen.active{ display:flex; }
h1{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:26px; margin-bottom:16px; }

@keyframes popIn{ 0%{transform:scale(0.2) rotate(-10deg); opacity:0;} 65%{transform:scale(1.12) rotate(3deg); opacity:1;} 100%{transform:scale(1) rotate(0);} }
@keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes bounceDot{ 0%,80%,100%{transform:scale(0.6); opacity:.5;} 40%{transform:scale(1); opacity:1;} }
@keyframes stampSlam{ 0%{transform:scale(3) rotate(-18deg); opacity:0;} 55%{transform:scale(0.9) rotate(-6deg); opacity:1;} 100%{transform:scale(1) rotate(-6deg);} }
@keyframes shakeUrgent{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);} }
@keyframes confettiFall{ 0%{transform:translateY(-24px) rotate(0deg); opacity:1;} 100%{transform:translateY(104vh) rotate(600deg); opacity:0;} }
@keyframes riseIn{ 0%{transform:translateY(30px); opacity:0;} 100%{transform:translateY(0); opacity:1;} }
@keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }

.confetti-piece{ position:fixed; top:-20px; z-index:9999; pointer-events:none; animation-name:confettiFall; animation-timing-function:cubic-bezier(.3,.6,.6,1); border-radius:2px; }

input{
  font-size:20px; padding:14px 16px; border:3px solid var(--ink); border-radius:10px;
  width:100%; max-width:320px; margin:0 auto 14px; background:#fff;
  box-shadow:3px 3px 0 var(--shadow-c);
}
.btn{
  font-weight:900; font-size:18px; padding:16px 36px; border-radius:12px; border:3px solid var(--shadow-c);
  background:var(--navy); color:#fff; cursor:pointer; width:100%; max-width:320px; margin:0 auto;
  box-shadow:4px 4px 0 var(--shadow-c); transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow-c); }
.btn:disabled{ opacity:.4; }
#join-error, #answer-status{ color:var(--red-deep); font-weight:900; min-height:20px; margin-top:4px;}
.mascot{ font-size:56px; margin-bottom:6px; animation:floaty 2.6s ease-in-out infinite; }

.q-prompt{
  font-family:'Noto Serif KR',serif; font-size:22px; line-height:1.6; margin:0 auto 24px;
  border:3px solid var(--ink); border-radius:14px; padding:20px; background:#fff; max-width:480px;
  box-shadow:4px 4px 0 var(--shadow-c);
}
.timer-mini{ font-weight:900; color:#fff; background:var(--red); font-size:16px; margin-bottom:14px; padding:6px 16px; border-radius:16px; border:2px solid var(--ink); }
.timer-mini.urgent{ background:var(--red-deep); animation:shakeUrgent .5s ease-in-out infinite; }
.answer-grid{ display:grid; gap:14px; width:100%; max-width:380px; margin:0 auto; }
.answer-grid.ox{ grid-template-columns:1fr 1fr; }
.answer-btn{
  border:3px solid var(--ink); border-radius:16px; padding:28px 10px; font-size:22px; font-weight:900;
  color:#fff; cursor:pointer; box-shadow:4px 4px 0 var(--shadow-c); transition:transform .1s ease, box-shadow .1s ease;
}
.answer-btn .opt-icon{ display:block; font-size:20px; margin-bottom:4px; opacity:.9; }
/* OX 버튼은 도형 아이콘 자체가 이미 O/X를 나타내므로 글자 없이 아이콘만 크게 보여준다. */
.answer-btn.ox-icon .opt-icon{ font-size:44px; margin-bottom:0; }
.answer-btn.opt-red{ background:var(--opt-red); }
.answer-btn.opt-blue{ background:var(--opt-blue); }
.answer-btn.opt-gold{ background:var(--opt-gold); color:var(--ink); }
.answer-btn.opt-green{ background:var(--opt-green); }
.answer-btn:active:not(:disabled){ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow-c); }
.answer-btn.picked{ outline:5px solid var(--ink); outline-offset:2px; }
.answer-btn:disabled{ opacity:.5; }

.waiting-dots{ display:flex; gap:10px; margin-top:18px; }
.waiting-dots span{ width:14px; height:14px; border-radius:50%; background:var(--navy); animation:bounceDot 1.2s ease-in-out infinite; }
.waiting-dots span:nth-child(2){ animation-delay:.15s; background:var(--red); }
.waiting-dots span:nth-child(3){ animation-delay:.3s; background:var(--gold-deep); }

.result-stamp{
  width:140px; height:140px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Noto Serif KR',serif; font-size:64px; font-weight:900; margin-bottom:16px; border:8px solid;
  transform:rotate(-6deg); background:#fff; animation:stampSlam .5s cubic-bezier(.34,1.56,.64,1) both;
}
.result-stamp.correct{ color:var(--green-deep); border-color:var(--green-deep); }
.result-stamp.wrong{ color:var(--red-deep); border-color:var(--red-deep); }
.result-answer{ color:var(--ink-soft); margin:0 auto 10px; max-width:340px; }
.streak-badge{
  display:inline-flex; align-items:center; gap:6px; background:var(--gold); color:var(--ink); font-weight:900;
  padding:8px 18px; border-radius:20px; border:3px solid var(--ink); margin-bottom:14px; box-shadow:3px 3px 0 var(--shadow-c);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
/* 대기 화면에서 "내가 이 닉네임으로 들어와 있다"를 스스로 확인할 수 있도록 표시 */
.my-nickname-badge{
  display:inline-flex; align-items:center; gap:6px; background:#fff; font-weight:900;
  padding:6px 16px; border-radius:20px; border:3px solid var(--ink); margin-bottom:18px; box-shadow:3px 3px 0 var(--shadow-c);
}
.score-line{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:20px; margin-top:6px; }
.score-line .num{ display:inline-block; animation:pop .35s ease; color:var(--red-deep); }
.rank-line{ color:var(--ink-soft); margin-top:6px; }

.final-medal{ font-size:70px; margin-bottom:10px; animation:floaty 2.4s ease-in-out infinite; }
.final-card{
  background:#fff; border:3px solid var(--ink); border-radius:16px; padding:26px 32px; box-shadow:6px 6px 0 var(--gold-deep);
  animation:riseIn .4s ease both;
}
</style>

<div id="join-screen" class="screen active">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, getDoc, getDocs,
  onSnapshot, query, where, orderBy, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(window.FIREBASE_CONFIG);
const db = getFirestore(app);

let session = null;   // {id, room_code, status, mode, advance_mode, time_limit, current_index} — questions는 별도 로딩
let questions = [];   // meta/questions 하위 문서에서 참여 시 한 번만 받아옴
let player = null;    // {id, nickname, score}
let answeredIndex = -1;
let streak = 0;
let unsubSession = null;
let unsubPlayerSelf = null;
let studentTimerInterval = null;
let joining = false;  // 참여하기 처리 중 중복 클릭 방지

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ============================================================
// 게이미피케이션 유틸: 컨페티
// ============================================================
function fireConfetti(count){
  count = count || 70;
  const colors = ['#FF4B4B','#3B82F6','#FFC93C','#28C76F','#8B5CF6'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    el.style.left = (Math.random()*100) + 'vw';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2 + Math.random()*1.6) + 's';
    el.style.animationDelay = (Math.random()*0.35) + 's';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

// 폼 제출(모바일 키보드의 "이동/완료" 포함)로 참여하기 연결
// joining 가드로 응답이 오기 전 여러 번 눌러도 중복 참여되지 않게 막는다.
document.getElementById("join-form").addEventListener("submit", e=>{
  e.preventDefault();
  if(joining) return;
  joinSession();
});

// 답변 버튼은 onclick="...('${텍스트}')" 형태로 만들지 않고 이벤트 위임으로 처리한다.
// 보기 텍스트를 JS 코드 문자열 안에 직접 끼워 넣으면, 작은따옴표(')가 포함된
// 보기가 나올 경우 escapeHtml을 거쳐도 브라우저가 속성값을 디코딩하면서
// 다시 실제 따옴표로 돌아와 onclick의 JS 문법이 깨져(버튼이 눌러도 반응 없음)
// 버리기 때문이다. data-value 속성 + 클릭 시점에 읽기로 이 문제를 원천 차단한다.
document.getElementById("answer-grid").addEventListener("click", e=>{
  const btn = e.target.closest(".answer-btn");
  if(!btn || btn.disabled) return;
  submitAnswer(btn.dataset.value);
});

// URL의 ?room= 값 자동 채우기
try{
  const params = new URLSearchParams(location.search);
  if(params.get("room")){
    document.getElementById("room-input").value = params.get("room").toUpperCase();
  }
}catch(e){}

// 새로고침 시 재접속 지원
// 일부 모바일 인앱 브라우저·프라이버시 모드에서는 sessionStorage 접근 자체가
// 예외를 던져서(SecurityError 등) 이 아래의 모든 스크립트 실행이 멈추고
// 버튼이 먹통이 될 수 있으므로 반드시 try/catch로 감싼다.
try{
  const saved = sessionStorage.getItem("quiz_player");
  if(saved){
    const s = JSON.parse(saved);
    rejoin(s.sessionId, s.playerId);
  }
}catch(e){}

async function joinSession(){
  const errEl = document.getElementById("join-error");
  const btn = document.getElementById("join-btn");
  errEl.textContent = "";
  const roomCode = document.getElementById("room-input").value.trim().toUpperCase();
  const nickname = document.getElementById("nickname-input").value.trim();
  if(!roomCode || !nickname){
    errEl.textContent = "방 코드와 닉네임을 모두 입력해주세요.";
    return;
  }

  // Firestore 왕복(방 조회 → 닉네임 중복 확인 → 문제 로드 → 참가자 생성)에 걸리는
  // 시간 동안 버튼을 다시 누르면 같은 학생이 중복 참여되므로, 처리 시작과 동시에
  // 버튼을 잠그고 "참여 중..."으로 표시한다. 에러로 중단되는 모든 경로에서
  // finally가 반드시 복구하므로 실패 시 다시 시도할 수 있다.
  joining = true;
  btn.disabled = true;
  btn.textContent = "참여 중...";
  try{
    const q = query(collection(db, "quiz_sessions"), where("room_code", "==", roomCode));
    const snap = await getDocs(q);
    if(snap.empty){
      errEl.textContent = "해당 방 코드를 찾을 수 없습니다. 다시 확인해주세요.";
      return;
    }
    const sessDoc = snap.docs[0];
    const sessData = sessDoc.data();
    if(sessData.status === "finished"){
      errEl.textContent = "이미 종료된 퀴즈입니다.";
      return;
    }

    // 같은 방에 이미 같은 닉네임이 있으면 막는다 (공백·대소문자 무시 비교).
    // 리더보드에서 이름이 겹쳐 보이는 걸 원천적으로 방지한다. 강퇴(kicked:true)된
    // 참가자의 닉네임은 다시 쓸 수 있어야 하므로 비교에서 제외한다.
    try{
      const playersSnap = await getDocs(collection(db, "quiz_sessions", sessDoc.id, "players"));
      const taken = playersSnap.docs.some(d => !d.data().kicked && String(d.data().nickname || "").trim().toLowerCase() === nickname.toLowerCase());
      if(taken){
        errEl.textContent = "이미 사용 중인 닉네임입니다. 다른 닉네임을 써주세요.";
        return;
      }
    }catch(e){
      errEl.textContent = "닉네임 확인에 실패했습니다: " + e.message;
      return;
    }

    // 문제 목록은 세션 문서 본체가 아니라 별도 하위 문서에 있으므로 참여 시 한 번만 받아온다.
    try{
      const qSnap = await getDoc(doc(db, "quiz_sessions", sessDoc.id, "meta", "questions"));
      questions = qSnap.exists() ? (qSnap.data().questions || []) : [];
    }catch(e){
      errEl.textContent = "문제 목록을 불러오지 못했습니다: " + e.message;
      return;
    }

    let playerRef;
    try{
      playerRef = await addDoc(collection(db, "quiz_sessions", sessDoc.id, "players"), {
        nickname, score: 0, joined_at: serverTimestamp()
      });
    }catch(e){
      errEl.textContent = "참여 실패: " + e.message;
      return;
    }

    session = { id: sessDoc.id, ...sessData };
    player = { id: playerRef.id, nickname, score: 0 };
    try{ sessionStorage.setItem("quiz_player", JSON.stringify({sessionId:session.id, playerId:player.id})); }catch(e){}
    startListening();
    renderForStatus();
  } finally {
    joining = false;
    btn.disabled = false;
    btn.textContent = "참여하기 🚀";
  }
}

async function rejoin(sessionId, playerId){
  const sessSnap = await getDoc(doc(db, "quiz_sessions", sessionId));
  const playerSnap = await getDoc(doc(db, "quiz_sessions", sessionId, "players", playerId));
  if(!sessSnap.exists() || !playerSnap.exists()) return;
  const qSnap = await getDoc(doc(db, "quiz_sessions", sessionId, "meta", "questions"));
  questions = qSnap.exists() ? (qSnap.data().questions || []) : [];
  session = { id: sessSnap.id, ...sessSnap.data() };
  player = { id: playerSnap.id, ...playerSnap.data() };

  // 새로고침 직후 answeredIndex가 -1로 리셋되어, 이미 제출한 문제도 다시 답변
  // 화면이 뜨거나(재제출 시 firestore.rules상 update 금지라 "제출 실패" 오류)
  // 정답 공개에서 실제로는 답했는데 "－"(미제출)로 잘못 표시되는 문제가 있었다.
  // 이미 저장된 답변 문서가 있는지 확인해 answeredIndex를 복원한다.
  try{
    const answerId = `${player.id}_${session.current_index}`;
    const ansSnap = await getDoc(doc(db, "quiz_sessions", sessionId, "answers", answerId));
    if(ansSnap.exists()) answeredIndex = session.current_index;
  }catch(e){}

  startListening();
  renderForStatus();
}

function startListening(){
  // 대기 화면에서 "내가 이 닉네임으로 들어와 있다"를 스스로 확인할 수 있게 표시.
  // 세션 중 닉네임이 바뀌지 않으므로 한 번만 설정하면 된다.
  document.getElementById("my-nickname-badge").textContent = `🙋 ${player.nickname}`;

  unsubSession = onSnapshot(doc(db, "quiz_sessions", session.id), snap=>{
    if(!snap.exists()) return;
    session = { id: snap.id, ...snap.data() };
    renderForStatus();
  });
  // 교사가 로비에서 강퇴하면 내 참가자 문서에 kicked:true가 세팅된다.
  // 실시간으로 감지해서 즉시 안내 화면으로 전환하고 모든 구독/타이머를 정리한다.
  unsubPlayerSelf = onSnapshot(doc(db, "quiz_sessions", session.id, "players", player.id), snap=>{
    if(snap.exists() && snap.data().kicked){
      clearInterval(studentTimerInterval);
      if(unsubSession){ unsubSession(); unsubSession = null; }
      if(unsubPlayerSelf){ unsubPlayerSelf(); unsubPlayerSelf = null; }
      try{ sessionStorage.removeItem("quiz_player"); }catch(e){}
      showScreen("kicked-screen");
    }
  });
}

function renderForStatus(){
  if(session.status === "lobby"){
    showScreen("waiting-screen");
  } else if(session.status === "active"){
    if(answeredIndex === session.current_index){
      document.getElementById("waiting-title").textContent = "제출 완료! 다음을 기다리는 중...";
      showScreen("waiting-screen");
    } else {
      renderQuestion();
      showScreen("answer-screen");
    }
  } else if(session.status === "reveal"){
    renderReveal();
    showScreen("reveal-screen");
  } else if(session.status === "finished"){
    renderFinal();
    showScreen("student-final-screen");
  }
}

const OPT_SHAPES = [
  {cls:"opt-red", icon:"▲"},
  {cls:"opt-blue", icon:"◆"},
  {cls:"opt-gold", icon:"●"},
  {cls:"opt-green", icon:"■"}
];

function renderQuestion(){
  const q = questions[session.current_index];
  document.getElementById("q-prompt-student").textContent = q.prompt;
  document.getElementById("answer-status").textContent = "";
  const grid = document.getElementById("answer-grid");
  if(q.type === "ox"){
    grid.className = "answer-grid ox";
    const oxShape = { "O": {cls:"opt-green", icon:"●"}, "X": {cls:"opt-red", icon:"✕"} };
    grid.innerHTML = ["O","X"].map(v=>`<button class="answer-btn ox-icon ${oxShape[v].cls}" data-value="${v}"><span class="opt-icon">${oxShape[v].icon}</span></button>`).join("");
  } else {
    grid.className = "answer-grid";
    grid.innerHTML = q.options.map((v,i)=>`<button class="answer-btn ${OPT_SHAPES[i%4].cls}" data-value="${escapeHtml(v)}"><span class="opt-icon">${OPT_SHAPES[i%4].icon}</span>${escapeHtml(v)}</button>`).join("");
  }
  const timerEl = document.getElementById("timer-mini");
  clearInterval(studentTimerInterval);
  if(session.advance_mode === "auto"){
    timerEl.style.display = "inline-block";
    timerEl.className = "timer-mini";
    startCountdown(timerEl);
  } else {
    timerEl.style.display = "none";
  }
}

// 교사 화면과 마찬가지로 실제로 초마다 줄어드는 카운트다운을 보여준다.
// question_started_at(서버 시각) 기준 경과 시간으로 계산해서, 학생 기기가
// 문제 화면을 조금 늦게 받아도 교사 화면과 크게 어긋나지 않게 한다.
function startCountdown(timerEl){
  const limit = session.time_limit || 20;
  const startedAtMs = (session.question_started_at && typeof session.question_started_at.toMillis === "function")
    ? session.question_started_at.toMillis() : Date.now();
  function tick(){
    const elapsed = (Date.now() - startedAtMs) / 1000;
    const remaining = Math.max(0, Math.ceil(limit - elapsed));
    timerEl.textContent = "⏱ 제한 시간 " + remaining + "초";
    timerEl.classList.toggle("urgent", remaining <= 5 && remaining > 0);
    if(remaining <= 0) clearInterval(studentTimerInterval);
  }
  tick();
  studentTimerInterval = setInterval(tick, 1000);
}

// 빨리 맞힐수록 고득점: 문제 시작 시각(question_started_at) 대비 경과 시간에 따라
// 정답 점수를 MAX_POINTS(즉시 정답)~MIN_POINTS(기준 시간 다 써서 정답) 사이로 선형 감점.
// 오답은 0점. 서버 계산이 아니라 클라이언트 계산이라 완벽한 부정행위 방지는 아니며,
// firestore.rules에 이미 명시된 "가벼운 보호 수준" 설계와 일관됩니다.
const MAX_POINTS = 1000, MIN_POINTS = 500;

function calcPoints(isCorrect){
  if(!isCorrect) return 0;
  const limit = session.time_limit || 20;
  const startedAtMs = (session.question_started_at && typeof session.question_started_at.toMillis === "function")
    ? session.question_started_at.toMillis() : Date.now();
  const elapsedSec = Math.max(0, (Date.now() - startedAtMs) / 1000);
  const ratio = Math.min(1, elapsedSec / limit);
  return Math.round(MAX_POINTS - (MAX_POINTS - MIN_POINTS) * ratio);
}

async function submitAnswer(val){
  clearInterval(studentTimerInterval);
  document.querySelectorAll(".answer-btn").forEach(b=>{
    b.disabled = true;
    if(b.dataset.value === val) b.classList.add("picked");
  });
  const q = questions[session.current_index];
  const isCorrect = (val === q.answer);
  const points = calcPoints(isCorrect);

  // 문서 ID를 "플레이어ID_문항번호"로 고정 → 같은 문항에 중복 제출 방지
  const answerId = `${player.id}_${session.current_index}`;
  try{
    await setDoc(doc(db, "quiz_sessions", session.id, "answers", answerId), {
      player_id: player.id, question_index: session.current_index,
      answer: val, is_correct: isCorrect, points_earned: points, answered_at: serverTimestamp()
    });
  }catch(e){
    document.getElementById("answer-status").textContent = "제출 실패: 오류가 발생했습니다.";
    return;
  }
  answeredIndex = session.current_index;
  if(points > 0){
    await updateDoc(doc(db, "quiz_sessions", session.id, "players", player.id), { score: increment(points) });
  }
  document.getElementById("waiting-title").textContent = "제출 완료! 다음을 기다리는 중...";
  showScreen("waiting-screen");
}

// 스탬프 O/X는 매 문제마다 새로 "쾅" 찍히는 느낌을 줘야 하는데, 연속으로 같은
// 결과(예: 정답 2연속)가 나오면 className이 그대로라 브라우저가 변화를 감지 못해
// 슬램 애니메이션이 재생되지 않는다. 클래스를 한번 비웠다가(+강제 리플로우) 다시
// 붙여서 매번 애니메이션이 새로 시작되도록 한다.
function playStamp(kind, text){
  const stamp = document.getElementById("result-stamp");
  stamp.classList.remove("correct", "wrong");
  void stamp.offsetWidth; // 강제 리플로우로 애니메이션 재시작
  stamp.textContent = text;
  stamp.classList.add(kind);
}

async function renderReveal(){
  const q = questions[session.current_index];
  const streakWrap = document.getElementById("streak-badge-wrap");
  streakWrap.innerHTML = "";
  if(answeredIndex === session.current_index){
    await checkMyAnswer();
  } else {
    streak = 0;
    playStamp("wrong", "－");
  }
  document.getElementById("result-answer-text").textContent = `정답: ${q.answer}` + (q.explain ? ` (${q.explain})` : "");
  if(streak >= 2){
    streakWrap.innerHTML = `<div class="streak-badge">🔥 ${streak}연속 정답!</div>`;
  }
  await showMyScore();
}

async function checkMyAnswer(){
  const answerId = `${player.id}_${session.current_index}`;
  const snap = await getDoc(doc(db, "quiz_sessions", session.id, "answers", answerId));
  if(snap.exists() && snap.data().is_correct){
    playStamp("correct", "O");
    streak++;
    // 컨페티는 매번 터뜨리면 금방 질리므로 연속 정답(스트릭)일 때만, 스트릭이
    // 쌓일수록 더 크게 터지도록 강약을 준다.
    if(streak >= 2) fireConfetti(Math.min(35 + streak*10, 90));
  } else {
    playStamp("wrong", "X");
    streak = 0;
  }
}

// 문제마다 획득 점수 내역 없이, 본인 현재 누적 점수만 보여준다.
async function showMyScore(){
  const meSnap = await getDoc(doc(db, "quiz_sessions", session.id, "players", player.id));
  const myScore = meSnap.exists() ? (meSnap.data().score || 0) : 0;
  document.getElementById("score-line").innerHTML = `현재 점수: <span class="num">${myScore}점</span>`;
}

async function renderFinal(){
  const meSnap = await getDoc(doc(db, "quiz_sessions", session.id, "players", player.id));
  const myScore = meSnap.exists() ? (meSnap.data().score || 0) : 0;
  document.getElementById("final-score-line").textContent = `내 점수: ${myScore}점`;

  const q2 = query(collection(db, "quiz_sessions", session.id, "players"), orderBy("score","desc"));
  const allSnap = await getDocs(q2);
  const all = allSnap.docs.map(d=>({ id:d.id, ...d.data() })).filter(p=>!p.kicked);
  const rank = all.findIndex(p=>p.id===player.id) + 1;
  document.getElementById("final-rank-line").textContent = `전체 ${all.length}명 중 ${rank}등`;

  const medalEl = document.getElementById("final-medal");
  if(rank === 1){ medalEl.textContent = "🥇"; fireConfetti(140); }
  else if(rank === 2){ medalEl.textContent = "🥈"; fireConfetti(90); }
  else if(rank === 3){ medalEl.textContent = "🥉"; fireConfetti(90); }
  else { medalEl.textContent = "🏁"; }

  try{ sessionStorage.removeItem("quiz_player"); }catch(e){}

  // 게임이 끝나면 더 이상 실시간으로 바뀔 데이터가 없으므로 구독을 정리한다.
  clearInterval(studentTimerInterval);
  if(unsubSession){ unsubSession(); unsubSession = null; }
  if(unsubPlayerSelf){ unsubPlayerSelf(); unsubPlayerSelf = null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
